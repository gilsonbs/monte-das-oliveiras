name: Gerar Artigos — Manual

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (slug)'
        required: true
        default: 'fim-dos-tempos'
        type: choice
        options:
          - crente-pode
          - devocional-diario
          - igreja-perseguida
          - lideranca-e-igreja
          - noticias-gospel
          - fim-dos-tempos
          - estudos-biblicos

permissions:
  contents: read

jobs:
  gerar:
    name: Gerar rascunho
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install groq google-genai cerebras-cloud-sdk supabase feedparser requests PyNaCl

      - name: Gerar artigo
        env:
          PUBLIC_SUPABASE_URL:          ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:         ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:                 ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:               ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:               ${{ secrets.PEXELS_API_KEY }}
          CEREBRAS_API_KEY:             ${{ secrets.CEREBRAS_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN:   ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_APP_SECRET:          ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_APP_ID:              "1092693706771528"
          FACEBOOK_PAGE_ID:             "622708424257879"
          VERCEL_DEPLOY_HOOK_URL:       ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          CATEGORY_SLUG:                ${{ inputs.category }}
        run: python scripts/gerar_artigos.py
