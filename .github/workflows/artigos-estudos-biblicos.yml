name: Artigos — Estudos Bíblicos (Ter/Qui/Sáb)

on:
  schedule:
    - cron: '0 13 * * 2,4,6'   # 10h BRT (UTC-3) — Terça, Quinta, Sábado
  workflow_dispatch: {}

jobs:
  gerar:
    name: Gerar rascunho — Estudos Bíblicos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install google-generativeai supabase feedparser requests

      - name: Gerar artigo
        env:
          PUBLIC_SUPABASE_URL:  ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          CATEGORY_SLUG:        estudos-biblicos
        run: python scripts/gerar_artigos.py
