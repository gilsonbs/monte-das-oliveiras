name: Gerar Artigos — Manual

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (slug)'
        required: true
        default: 'fim-dos-tempos'
        type: choice
        options:
          - crente-pode
          - devocional-diario
          - igreja-perseguida
          - lideranca-e-igreja
          - noticias-gospel
          - fim-dos-tempos
          - estudos-biblicos

jobs:
  gerar:
    name: Gerar rascunho
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install groq google-genai supabase feedparser requests

      - name: Gerar artigo
        env:
          PUBLIC_SUPABASE_URL:  ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          CATEGORY_SLUG:        ${{ inputs.category }}
        run: python scripts/gerar_artigos.py
