name: Postar no Facebook

on:
  schedule:
    - cron: "0 10,14,18 * * *"   # 10h, 14h e 18h UTC (7h, 11h, 15h Brasília)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install supabase requests

      - name: Postar próximo artigo no Facebook
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: "622708424257879"
        run: python scripts/postar_facebook.py
