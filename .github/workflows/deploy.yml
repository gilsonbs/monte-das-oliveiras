name: Social Cards e Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

concurrency:
  group: content-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  social-cards-e-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install supabase Pillow requests

      - name: Gerar cards para redes sociais
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/gerar_card_social.py --recent 5

      - name: Forçar deploy pela main
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .content-build-trigger
          git add .content-build-trigger

          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar."
            exit 0
          fi

          git commit -m "chore: trigger content deploy"
          git push origin HEAD:main
          echo "✓ Commit enviado para main. A Vercel deve iniciar o deploy pelo Git."
