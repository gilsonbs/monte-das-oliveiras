name: Social Cards e Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read

jobs:
  social-cards-e-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install supabase Pillow requests

      - name: Gerar cards para redes sociais
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/gerar_card_social.py --recent 5

      - name: Acionar rebuild no Vercel
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL não está configurado nos secrets do GitHub."
            exit 1
          fi

          STATUS=$(curl -sS -o vercel-response.txt -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "Vercel Deploy Hook status: $STATUS"
          cat vercel-response.txt

          if [ "$STATUS" = "201" ] || [ "$STATUS" = "200" ]; then
            echo "✓ Deploy acionado"
          else
            echo "Falha ao acionar deploy no Vercel. Status inesperado: $STATUS"
            exit 1
          fi
