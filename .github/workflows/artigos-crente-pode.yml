name: Artigos — Crente Pode? (Ter/Qui/Sáb)

on:
  workflow_dispatch: {}

jobs:
  gerar:
    name: Gerar rascunho — Crente Pode?
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install groq google-genai cerebras-cloud-sdk supabase feedparser requests

      - name: Gerar artigo
        env:
          PUBLIC_SUPABASE_URL:  ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          CEREBRAS_API_KEY:         ${{ secrets.CEREBRAS_API_KEY }}
          VERCEL_DEPLOY_HOOK_URL:   ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          CATEGORY_SLUG:            crente-pode
        run: python scripts/gerar_artigos.py
