name: Artigos — Fim dos Tempos (Seg/Qua/Sex)

on:
  schedule:
    - cron: '0 13 * * 1,3,5'   # 10h BRT (UTC-3) — Segunda, Quarta, Sexta
  workflow_dispatch: {}

jobs:
  gerar:
    name: Gerar rascunho — Fim dos Tempos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install groq google-genai supabase feedparser requests

      - name: Gerar artigo
        env:
          PUBLIC_SUPABASE_URL:  ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          CATEGORY_SLUG:        fim-dos-tempos
        run: python scripts/gerar_artigos.py
