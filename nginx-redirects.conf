# =========================================================================
# Monte das Oliveiras — Configuração de Redirecionamentos Nginx (301)
# Cole estas regras dentro do bloco 'server' do Nginx no seu servidor (VPS)
# =========================================================================

# 1. Redirecionamento de links de artigos com datas do WordPress
# Exemplo: /2024/02/15/nome-do-post/ -> /nome-do-post/
rewrite ^/[0-9]{4}/[0-9]{2}/[0-9]{2}/([^/]+)/?$ /$1/ permanent;

# 2. Redirecionamento de categorias antigas do WordPress
# Exemplo: /category/fim-dos-tempos/ -> /categoria/fim-dos-tempos/
rewrite ^/category/([^/]+)/?$ /categoria/$1/ permanent;

# 3. Redirecionamento de feeds antigos do WordPress
# Exemplo: /feed/ ou /rss/ -> /rss.xml
rewrite ^/(feed|rss)/?$ /rss.xml permanent;

# 4. Redirecionamento global para garantir HTTPS e barra final (trailing slash) nas rotas principais
# (Isso evita conteúdo duplicado e garante consistência para os robôs do Google)
if ($request_uri !~* "^/(admin|api|dist|public|assets|_astro|favicon|robots\.txt|sitemap|rss\.xml|ads\.txt)") {
    rewrite ^([^.\?]*[^/])$ $1/ permanent;
}
